[workspace]
resolver = "3"
members = ["crates/lmyzmail"]
exclude = ["tools/lmyzmail-xdp-check"]
default-members = ["crates/lmyzmail"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[profile.release]
codegen-units = 1
lto = false
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = 1
