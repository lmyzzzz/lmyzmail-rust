[package]
name = "lmyzmail-xdp-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Privileged isolated-kernel acceptance gate for lmyzmail XDP"

[dependencies]
lmyzmail = { path = "../../crates/lmyzmail", features = ["xdp-test-hooks"] }
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }

[build-dependencies]
cc = "1.4.0"
