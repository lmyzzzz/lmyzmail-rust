[package]
name = "lmyzmail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "lmyzmail modular monolith runtime"

[[bin]]
name = "lmyzmail"
path = "src/main.rs"

[features]
default = []
xdp-test-hooks = []

[dependencies]
base64 = "0.22.1"
ammonia = "4.1.4"
bcrypt = "0.19.3"
cairo-rs = { version = "0.22.0", default-features = false, features = ["freetype"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
deadpool-postgres = "0.14.1"
deadpool-redis = { version = "0.23.0", default-features = false, features = ["rt_tokio_1", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
getrandom = "0.4.3"
flate2 = { version = "1.1.2", default-features = false, features = ["zlib"] }
futures-util = "0.3.31"
hickory-resolver = "0.26.1"
httparse = "1.10.1"
idna = "1.1.0"
icu_casemap = "=1.5.1"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
ipnet = "2.11.0"
mail-parser = "0.11.5"
mail-auth = { version = "0.11.2", default-features = false, features = ["dns-hickory", "rust-crypto"] }
mail-builder = { version = "0.4.4", default-features = false }
md-5 = "0.11.0"
mime = "0.3.17"
moka = { version = "0.12.15", features = ["future"] }
percent-encoding = "2.3.1"
openssl = "0.10.81"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
regex = "1.11.1"
resvg = { version = "0.45.1", default-features = false, features = ["raster-images"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
url = "2.5.7"
webpki-roots = "1.0.3"
zeroize = "1.8.1"

[dev-dependencies]
proptest = "1.7.0"

[build-dependencies]
cc = "1.4.0"
pkg-config = "0.3.33"
sha2 = "0.11.0"
